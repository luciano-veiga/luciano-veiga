name: Update Profile Graphs

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 03:00 UTC (~00:00 em Bahia)
  workflow_dispatch:        # permite rodar manualmente pelo botão "Run workflow"

jobs:
  update-graphs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Criar pasta de saída
        run: mkdir -p profile

      - name: Baixar Activity Graph
        run: |
          curl -sf --retry 3 --retry-delay 5 \
            "https://github-readme-activity-graph.vercel.app/graph?username=luciano-veiga&bg_color=0d1117&color=39d353&line=00ffcc&point=ffffff&area=true&hide_border=true" \
            -o profile/activity-graph.tmp.svg && mv profile/activity-graph.tmp.svg profile/activity-graph.svg || \
            echo "⚠️ Activity Graph indisponível hoje, mantendo versão anterior"

      - name: Baixar GitHub Stats (Streak)
        run: |
          curl -sf --retry 3 --retry-delay 5 \
            "https://streak-stats.demolab.com/?user=luciano-veiga&theme=tokyonight&hide_border=true" \
            -o profile/streak-stats.tmp.svg && mv profile/streak-stats.tmp.svg profile/streak-stats.svg || \
            echo "⚠️ Streak Stats indisponível hoje, mantendo versão anterior"

      - name: Commitar SVGs atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: atualiza gráficos do perfil"
          git push
